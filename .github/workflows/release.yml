name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean verify
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/CyoriaMOTDGuard-*.jar \
            --verify-tag \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Experimental Folia 1.21.11 build. Uses public Netty ChannelPipeline access; requires PacketEvents 2.13.0. BannerMOTDplus is optional."
